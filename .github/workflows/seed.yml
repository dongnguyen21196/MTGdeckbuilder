name: Seed dữ liệu

# Vercel Hobby chỉ cho cron 1 lần/ngày và Function trần 60s, trong khi seed
# EDHREC cho ~1.800 commander mất khoảng 30 phút. Vì vậy job này chạy ở đây
# thay vì trên Vercel.
on:
  schedule:
    - cron: "0 19 * * *" # 02:00 giờ Việt Nam
  workflow_dispatch:
    inputs:
      limit:
        description: "Giới hạn số commander fetch EDHREC (bỏ trống = không giới hạn)"
        required: false
        type: string

concurrency:
  group: seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - run: pip install -r api/requirements.txt

      - name: Seed
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            python scripts/seed.py --all --limit "${{ inputs.limit }}"
          else
            python scripts/seed.py --all
          fi
